[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-aapclient"
version = "2.0.0"
description = "Command-line client for Ansible Automation Platform (AAP)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "AAP Client Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0.0",        # CLI framework
    "click-option-group>=0.5.6",  # Mutually exclusive option groups
    "rich>=13.0.0",        # Enhanced output formatting
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "flake8-pyproject>=1.2.0",  # Allows flake8 to read pyproject.toml
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",      # Type stubs for PyYAML
    "types-requests>=2.32.0",   # Type stubs for requests
    "autoflake>=2.0.0",         # Remove unused imports and variables
]

[project.urls]
"Homepage" = "https://github.com/jce-redhat/python-aapclient"
"Bug Tracker" = "https://github.com/jce-redhat/python-aapclient/issues"



[project.scripts]
aap = "aapclient.core:main"              # Rich CLI (only option)

[tool.setuptools.packages.find]
where = ["."]
include = ["aapclient*"]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]  # Black compatibility
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
